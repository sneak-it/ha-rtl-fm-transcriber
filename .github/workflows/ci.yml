name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the Python in the Alpine 3.24 base images the add-on ships on
          # (see build.json). Bump both together.
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install -r rtl-fm-transcriber/requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q

  # Builds the image the same way the Supervisor does: plain docker build with
  # BUILD_FROM taken from build.json. The home-assistant/builder action is
  # deprecated and slated for removal, and its replacement is aimed at publishing
  # images to a registry, which this add-on does not do (no image key in
  # config.yaml means every install builds locally).
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Resolve base image for ${{ matrix.arch }}
        id: base
        run: |
          echo "image=$(jq -er '.build_from["${{ matrix.arch }}"]' rtl-fm-transcriber/build.json)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.arch }} add-on image
        uses: docker/build-push-action@v7
        with:
          context: ./rtl-fm-transcriber
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
