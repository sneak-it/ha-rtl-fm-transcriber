template:
  - triggers:
      - platform: mqtt
        topic: "radio/transcription"
    sensor:
      - name: "Radio Transcription History"
        unique_id: rtl_fm_transcription_history
        state: "{{ trigger.payload }}"
        attributes:
          # Parse incoming message and append to existing history array
          # Keeps only the last 20 entries to prevent unbounded growth
          history: >-
            {% set new_entry = trigger.payload_json | default({}) %}
            {% set current = state_attr('sensor.radio_transcription_history', 'history') | default([], true) %}
            {% set updated = current + [new_entry] %}
            {% set limited = updated[-20:] %}
            {{ limited | tojson }}
          last_transcription: "{{ new_entry.text | default('') }}"
          last_frequency: "{{ new_entry.frequency | default('') }}"
          last_timestamp: "{{ new_entry.timestamp | default('') }}"

