# ============================================================
# RTL-FM Transcription Stream - Lovelace Dashboard Card
# ============================================================
#
# The inline <audio> player below needs recordings to be reachable at /local/,
# so it only works with audio_public_www: true. That path is served WITHOUT
# authentication; with the default (audio_public_www: false) recordings live
# under /media and the payload's audio_url is a media-source:// URI, which you
# play through the Media browser or media_player.play_media instead.

type: vertical-stack
cards:
  - type: custom:stack-in-card
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Radio Transcriptions
            secondary: >-
              {{ state_attr('sensor.radio_transcription_history', 'history') |
              default([], true) | length }} recent
            icon: mdi:radio-handheld
            icon_color: blue
            entity: sensor.radio_transcription_history
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('sensor.radio_transcription_history',
              'last_transcription') | default('Waiting for transcriptions...',
              true) | truncate(40, true, '...') }}
            secondary: >-
              {{ state_attr('sensor.radio_transcription_history',
              'last_timestamp') | default('N/A', true) }} | {{
              state_attr('sensor.radio_transcription_history', 'last_frequency')
              | default('N/A', true) }} MHz
            icon: mdi:message-text
            icon_color: green
            entity: sensor.radio_transcription_history
            tap_action:
              action: more-info
  - type: markdown
    content: >-
      {% set history = state_attr('sensor.radio_transcription_history',
      'history') | default([], true) %}

      {% if history | length == 0 %}

      **No transcriptions received yet.**

      {% else %}

      {% for entry in history[-5:] | reverse %}

      ---

      **{{ as_timestamp(entry.timestamp) | timestamp_custom('%H:%M:%S %m/%d/%y')
      | default('Unknown', true) }}** — {{ entry.frequency | default('Unknown',
      true) }} MHz

      {{ entry.text | default('No text', true) }}

      {% if entry.audio_file | default(false, true) %}

      {% if entry.audio_url | default('', true) is search('^/local/') %}

      <audio controls src="{{ entry.audio_url }}" type="audio/wav"
      preload="metadata">
        Your browser does not support the audio element.
      </audio>

      {% else %}

      `{{ entry.audio_file }}` (open via the Media browser)

      {% endif %}

      {% endif %}

      {% endfor %}

      {% endif %}
