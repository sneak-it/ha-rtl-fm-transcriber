[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".ruff_cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "ASYNC", "B", "RUF", "PLW"]
# E501: existing log strings run long; not worth reflowing.
# ASYNC109: Wyoming connect/stop_session own their timeout by design (review B7/B8).
# BLE/S: enabled once the broad except unions are tightened (review item F7).
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]
