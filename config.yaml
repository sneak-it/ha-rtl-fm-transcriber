name: "RTL-FM Transcriber"
version: "1.3.0"
slug: rtl-fm-transcriber
description: "Captures FM radio via RTL-SDR, transcribes with Whisper, publishes to MQTT"
init: false
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
host_network: true
usb: true
udev: true
devices:
  - /dev/bus/usb
map:
  - config:rw
options:
  frequency: 155.1075
  squelch: 50
  chunk_duration: 15
  whisper_url: "http://youriphere:10300"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_topic: "radio/transcription"
  mqtt_username: ""
  mqtt_password: ""
  vad_threshold: 0.01
  vad_baseline_window: 30
  gain: "auto"
  debug_audio: false
  ppm: 0
  bandpass_filter: true
  bandpass_low: 300
  bandpass_high: 3000
  timezone: "UTC"
schema:
  frequency: float
  squelch: int(0,200)
  chunk_duration: int(5,60)
  whisper_url: url
  mqtt_host: str
  mqtt_port: int
  mqtt_topic: str
  mqtt_username: str?
  mqtt_password: str?
  vad_threshold: float
  vad_baseline_window: int(5,120)
  gain: str?
  debug_audio: bool
  ppm: int(0,500)
  bandpass_filter: bool
  bandpass_low: int(100,5000)
  bandpass_high: int(1000,12000)
  timezone: str?
