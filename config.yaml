name: "RTL-FM Transcriber"
version: "1.3.0"
slug: rtl-fm-transcriber
description: "Captures FM radio via RTL-SDR, transcribes with Whisper, publishes to MQTT"
init: false
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
host_network: true
usb: true
udev: true
devices:
  - /dev/bus/usb
map:
  - config:rw
options:
  frequency: 155.1075
  squelch: 50
  chunk_duration: 15
  whisper_url: "http://youriphere:10300"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_topic: "radio/transcription"
  mqtt_username: ""
  mqtt_password: ""
  vad_threshold: 0.03
  vad_baseline_window: 30
  gain: "auto"
  debug_audio: false
  ppm: 0
  bandpass_filter: true
  bandpass_low: 300
  bandpass_high: 3000
  timezone: "UTC"
  # Streaming segmentation options
  silence_timeout: 2.0
  vad_warmup_ms: 150
  min_transmission_duration: 0.3
  max_transmission_duration: 120.0
  vad_recovery_seconds: 1.0
  # Wyoming connection settings
  wyoming_connection_timeout: 10.0
  wyoming_read_timeout: 30.0
  wyoming_reconnect_max_attempts: 3
  wyoming_reconnect_delay: 1.0
  # Audio recording settings
  audio_recording: false
  audio_retention_days: 7
  audio_max_files: 0
schema:
  frequency: float
  squelch: int(0,200)
  chunk_duration: int(5,60)
  whisper_url: url
  mqtt_host: str
  mqtt_port: int
  mqtt_topic: str
  mqtt_username: str?
  mqtt_password: str?
  vad_threshold: float
  vad_baseline_window: int(5,120)
  gain: str?
  debug_audio: bool
  ppm: int(0,500)
  bandpass_filter: bool
  bandpass_low: int(100,5000)
  bandpass_high: int(1000,12000)
  timezone: str?
  silence_timeout: float
  vad_warmup_ms: int(50,1000)
  min_transmission_duration: float
  max_transmission_duration: float
  vad_recovery_seconds: float
  wyoming_connection_timeout: float
  wyoming_read_timeout: float
  wyoming_reconnect_max_attempts: int(1,10)
  wyoming_reconnect_delay: float(0.5,10.0)
  audio_recording: bool
  audio_retention_days: int(1,365)
  audio_max_files: int(0,10000)
