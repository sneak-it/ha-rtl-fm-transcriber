name: "RTL-FM Transcriber"
version: "1.2.2"
slug: rtl-fm-transcriber
description: "Captures FM radio via RTL-SDR, transcribes with Whisper, publishes to MQTT"
init: false
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
host_network: true
usb: true
udev: true
devices:
  - /dev/bus/usb
map:
  - config:rw
options:
  frequency: 155.1075
  squelch: 50
  chunk_duration: 15
  whisper_url: "http://youriphere:10300"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_topic: "radio/transcription"
  mqtt_username: ""
  mqtt_password: ""
  vad_threshold: 0.01
  gain: "auto"
  debug_audio: false
schema:
  frequency: float
  squelch: int(0,1000)
  chunk_duration: int(5,60)
  whisper_url: url
  mqtt_host: str
  mqtt_port: int
  mqtt_topic: str
  mqtt_username: str?
  mqtt_password: str?
  vad_threshold: float
  gain: str?
  debug_audio: bool
